<style>
:root{
  --bg:#09090B;--s1:#111113;--s2:#18181B;--s3:#212126;--line:#232328;--line2:#2E2E35;
  --ink:#FAFAFA;--ink2:#D4D4D8;--muted:#8B8B94;
  --ac:#FFD400;--acTxt:#09090B;--acSoft:rgba(255,212,0,.14);--acGlow:rgba(255,212,0,.08);--acLine:rgba(255,212,0,.38);
  --ok:#22C55E;--okT:#4ADE80;--amar:#F59E0B;--amarT:#FBBF24;--rojo:#EF4444;--rojoT:#F87171;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top,0px) + 6px) 16px calc(92px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;min-height:100vh;background:radial-gradient(120% 320px at 50% -60px,var(--acGlow),transparent 70%) no-repeat,var(--bg)}
body.sinNav{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:700}
h1{font-size:26px;line-height:1.15}h2{font-size:20px;line-height:1.2}h3{font-size:16px;line-height:1.3;font-weight:600}
b{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab{font-variant-numeric:tabular-nums}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(55% 40% at 50% 45%,rgba(255,212,0,.10),transparent 70%),var(--bg);transition:opacity .5s ease}
#intro img.lg{width:min(62vw,270px);height:auto;opacity:0;transform:scale(.94);animation:introLogo .9s .1s cubic-bezier(.2,.8,.2,1) forwards}
#intro.fuera{opacity:0;pointer-events:none}
.introZw{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;opacity:0;animation:introLogo .8s .7s forwards}
.introZw img{height:20px;width:auto}
@keyframes introLogo{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro img.lg,.introZw{animation:none;opacity:1;transform:none}}
/* Barra superior y títulos */
.top{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.logo{flex:none;width:34px;height:34px;border-radius:9px;background:#000 center/cover no-repeat;box-shadow:0 0 0 1px var(--acLine),0 0 18px var(--acGlow)}
.top .t{flex:1;min-width:0}.top .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.tit{margin:18px 0 18px}.tit h1{font-size:28px}.tit h1::after{content:"";display:block;width:34px;height:3px;border-radius:3px;background:var(--ac);margin-top:10px}.tit p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:radial-gradient(140% 90% at 100% 0%,var(--acGlow),transparent 45%),var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.ct{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink)}
.ct svg.i{width:16px;height:16px;color:var(--ac)}
.muted{color:var(--muted)}.small{font-size:13px}.centro{text-align:center}
.row{display:flex;gap:10px;align-items:center}.row.w{flex-wrap:wrap}.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:12px;color:var(--muted);font-weight:500;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.lbl::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--ac);flex:none}
/* Botones */
.btn{border:0;border-radius:12px;height:48px;padding:0 18px;font:600 15px var(--f);background:var(--ac);color:var(--acTxt);width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:opacity .15s,transform .1s}
.btn:active{opacity:.85;transform:scale(.99)}
.btn.sec{background:var(--s2);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.ok{background:var(--ok);color:#03150A}
.btn.wa{background:#22C55E;color:#03150A}
.btn.no{background:transparent;color:var(--rojoT);border:1px solid rgba(239,68,68,.35)}
.btn.chico{height:38px;width:auto;padding:0 14px;font-size:14px;border-radius:10px}
.ibtn{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--ink2);white-space:nowrap}
.chip svg.i{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:rgba(34,197,94,.12);color:var(--okT)}.p-pronto{background:rgba(245,158,11,.12);color:var(--amarT)}.p-venc{background:rgba(239,68,68,.12);color:var(--rojoT)}
.p-gris{background:var(--s2);color:var(--muted)}
/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(9,9,11,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.nav div{display:flex;width:100%;max-width:620px}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--muted);font-weight:500;font-size:11px;position:relative}
.nav button svg.i{width:22px;height:22px;stroke-width:1.7}
.nav button.on{color:var(--ink)}
.nav button.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--ac)}
/* Formularios */
.campo{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);font-size:15px;outline:none;transition:border-color .15s}
.campo:focus{border-color:var(--ac)}
textarea.campo{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
select.campo{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.buscar{position:relative}.buscar svg.i{position:absolute;left:13px;top:14px;color:var(--muted)}.buscar .campo{padding-left:40px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;border-radius:9px;height:36px;background:none;font-weight:500;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--s3);color:var(--ink)}
.barra{height:6px;border-radius:99px;background:var(--s3);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s}
/* Números y listas */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac),transparent 75%)}
.kpi.dest{background:linear-gradient(145deg,var(--acSoft),var(--acGlow) 60%,var(--s1));border-color:var(--acLine)}
.kpi.dest .v{color:var(--ac)}
.kpi .v{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.25}
.dot{flex:none;width:8px;height:8px;border-radius:50%}
.fila{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-decoration:none}
.fila:first-child{border-top:0}
.fila .der{color:var(--muted)}
.av{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--acGlow);box-shadow:inset 0 0 0 1px var(--acSoft);font-weight:600;font-size:13px;color:var(--ac)}
.mini{flex:none;width:56px;height:42px;border-radius:8px;object-fit:cover;background:#fff}
.sub{font-size:13px;color:var(--muted);line-height:1.35}
.foto{position:relative;border-radius:14px;overflow:hidden;background:#fff;aspect-ratio:4/3;margin-top:14px}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto .b{animation:ver 2.8s infinite}
@keyframes ver{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@keyframes ver2{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
.foto .et{position:absolute;left:10px;bottom:10px;padding:3px 9px;border-radius:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:600;letter-spacing:.02em}
.foto .et.a2{animation:ver2 2.8s infinite}.foto .et.b{animation:ver 2.8s infinite}
/* Capas y hojas */
.capa{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.capa .in{max-width:620px;margin:0 auto}
.hojaF{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.66);animation:fade .2s}
.hojaF .in{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--s1);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;animation:subeH .25s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes subeH{from{transform:translateY(30px);opacity:.6}}
.agarre{width:36px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
/* Entrenamiento */
.prog{display:flex;gap:4px;margin:12px 0 16px}.prog i{flex:1;height:3px;border-radius:9px;background:var(--s3)}.prog i.ok{background:var(--ok)}.prog i.on{background:var(--ac)}
.objetivo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.objetivo div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px}
.objetivo b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.objetivo small{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.num-in{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:5px}
.num-in button{width:44px;height:44px;border-radius:9px;border:0;background:var(--s3);display:grid;place-items:center;color:var(--ink)}
.num-in input{flex:1;min-width:0;text-align:center;background:none;border:0;font-size:26px;font-weight:700;outline:none;font-variant-numeric:tabular-nums}
.reloj{width:220px;height:220px;margin:22px auto;position:relative}
.reloj svg{transform:rotate(-90deg)}
.reloj .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.reloj .t b{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.consejo{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink2);margin-top:12px;line-height:1.45}
.consejo.rojo{border-left-color:var(--rojo)}.consejo.amar{border-left-color:var(--amar)}
.series{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.serie{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:rgba(34,197,94,.08);color:var(--okT);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#FAFAFA;color:#09090B;padding:11px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;animation:sube .25s;display:flex;gap:8px;align-items:center}
@keyframes sube{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes late{50%{opacity:.55}}.late{animation:late 1s infinite}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;border:1px solid var(--line);background:var(--s1);color:var(--ink2);border-radius:999px;padding:0 14px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.chips button.on{background:var(--ac);color:var(--acTxt);border-color:var(--ac)}
.dias7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dias7 button{height:38px;border-radius:9px;background:var(--s2);font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line)}
.dias7 button.on{color:var(--acTxt);background:var(--ac);border-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:500;background:var(--s2);color:var(--muted);position:relative;font-variant-numeric:tabular-nums}
.cal div.v{background:var(--acSoft);color:var(--ink)}
.cal div.e::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--ok)}
.cal div.hoy{box-shadow:inset 0 0 0 1.5px var(--ac)}.cal div.x{background:none}
.cal .cab{background:none;aspect-ratio:auto;font-size:11px;padding-bottom:2px}
.graf{width:100%;display:block}
.clase{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;color:inherit}
.clase .ico{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--acSoft);color:var(--ac)}
.clase .ico svg.i{width:20px;height:20px}
.clase.mia{border-color:rgba(34,197,94,.45)}
.tecla{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:16px auto 0}
.tecla button{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-size:24px;font-weight:500;display:grid;place-items:center}
.tecla button:active{background:var(--s2)}
.tecla .okb{background:var(--ac);color:var(--acTxt);border-color:var(--ac)}
.pantallaDni{font-size:34px;font-weight:600;letter-spacing:.06em;text-align:center;padding:0 8px;height:72px;display:grid;place-items:center;border-radius:14px;background:var(--s1);border:1px solid var(--line2);margin-top:16px;font-variant-numeric:tabular-nums}
.qr{background:#fff;border-radius:18px;padding:16px;width:max-content;margin:20px auto}
.qr img,.qr canvas{display:block;width:230px!important;height:230px!important}
.sw{width:36px;height:36px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sw.on{border-color:var(--ink)}
.ejRow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--s2);border:1px solid var(--line);margin-top:8px}
.ctl{display:flex;gap:4px}
.ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--s1);display:grid;place-items:center;color:var(--ink2)}
.ctl button svg.i{width:14px;height:14px}
.inChico{width:64px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line2);background:var(--s1);text-align:center;font-weight:600;font-size:13px;outline:none}
.bienv{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:10px;background:radial-gradient(70% 35% at 50% 18%,rgba(255,212,0,.07),transparent 70%)}
.bigBtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);color:inherit}
.bigBtn .e{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--acSoft);color:var(--ac)}
.bigBtn .e svg.i{width:22px;height:22px}
.bigBtn b{display:block;font-size:16px}
.resultado{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);animation:fade .2s}
.resultado .circ{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin-bottom:22px}
.resultado .circ svg.i{width:60px;height:60px;stroke-width:2.2}
.resultado h1{font-size:34px}
.resultado p{font-size:18px;color:var(--ink2);margin:10px 0 0;line-height:1.5}
#cam video{width:100%;border-radius:16px;background:#000;aspect-ratio:3/4;object-fit:cover;margin-top:12px}
.firma{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;margin-top:14px}
.firma img{height:20px;width:auto}
.hero-num{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.enlace{background:none;border:0;padding:0;color:var(--ink2);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.enlace svg.i{width:14px;height:14px}
.acceso{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;text-align:left;color:inherit;width:100%}
.acceso .e{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acSoft);color:var(--ac)}
.acceso b{display:block;font-size:14px}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pasos div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.pasos .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acSoft);color:var(--ink);font-size:12px;font-weight:600;margin-bottom:8px}
.pasos b{display:block;font-size:13px;line-height:1.25;margin-bottom:3px}.pasos .sub{font-size:12px;display:block}
.kpi .k{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
</style>

// Entradas simuladas hasta ahora (solo en la demo): la ocupación y las estadísticas se ven «vivas».
function simular(){
  if (!DB.demo) return;
  const r = azar(Math.floor(DB.simHasta / 1000)), ahora = Date.now();
  const activos = DB.socios.filter(s => s.id !== "s1");
  let t = new Date(DB.simHasta); t.setMinutes(0, 0, 0);
  const yaHoy = {};
  while (t.getTime() <= ahora) {
    const dow = t.getDay(), h = t.getHours(), f = fstr(t), rit = dow === 0 ? 0 : (dow === 6 ? RITMO_SAB : RITMO)[h] || 0;
    const n = Math.round(rit * (.75 + r() * .5));
    for (let k = 0; k < n; k++) {
      const ts = t.getTime() + Math.floor(r() * 3600e3);
      if (ts <= DB.simHasta || ts > ahora) continue;
      const s = activos[Math.floor(r() * activos.length)];
      if (diasEntre(s.vence, f) > 10) continue;           // los que dejaron de pagar hace rato no vienen
      const clave = s.id + f; if (yaHoy[clave]) continue; yaHoy[clave] = 1;
      DB.asistencias.push({s:s.id, t:ts});
    }
    t = new Date(t.getTime() + 3600e3);
  }
  DB.simHasta = ahora;
  const corte = ahora - 120 * 864e5;
  DB.asistencias = DB.asistencias.filter(a => a.t >= corte).sort((a, b) => a.t - b.t);
  guardar();
}

function textoHorario(){

  [1,2,3,4,5,6,0].forEach(d => { const h = H[d], k = h ? h.join("-") : "x", u = grupos[grupos.length - 1]; if (u && u.k === k) u.d.push(d); else grupos.push({k, d:[d], h}); });
  return grupos.filter(g => g.h).map(g => `${DIA3[g.d[0]]}${g.d.length > 1 ? " a " + DIA3[g.d[g.d.length - 1]] : ""} ${g.h[0]} a ${g.h[1]} h`).join(" · ");
}
// Promedio de entradas por hora para un día de la semana (últimas 4 semanas)
function promedioHoras(dow){
  const desde = Date.now() - 28 * 864e5, c = {};
  DB.asistencias.forEach(a => { if (a.t < desde) return; const d = new Date(a.t); if (d.getDay() === dow) c[d.getHours()] = (c[d.getHours()] || 0) + 1; });
  Object.keys(c).forEach(h => c[h] /= 4); return c;
}
function mejorHorario(){
  const ahora = new Date(), h = DB.gym.horario[ahora.getDay()];
  if (!h || ahora.getHours() >= h[1] - 1) return "mañana a primera hora";
  const prom = promedioHoras(ahora.getDay());
  let mejor = null;
  for (let x = Math.max(h[0], ahora.getHours() + 1); x < h[1] - 1; x++) if (mejor === null || (prom[x] || 0) < (prom[mejor] || 0)) mejor = x;
  return mejor === null ? "mañana a primera hora" : `de ${mejor} a ${mejor + 1} h`;
}
function nivelOcupacion(){
  if (!abierto()) return {txt:"Cerrado", col:"var(--muted)", n:0, p:0, cerrado:true};
  const n = enGimnasio(), p = n / (DB.gym.capacidad || 35);
  return p < .35 ? {txt:"Tranquilo", col:"var(--ok)", n, p} : p < .7 ? {txt:"Concurrido", col:"var(--amar)", n, p} : {txt:"Lleno", col:"var(--rojo)", n, p};
}

function ranking(){

function tecla(a, b){
  const T = teclado; if (!T) return;

  else if (a === "tecBorrar") T.val = T.val.slice(0, -1);
  else if (a === "tecCancelar") { teclado = null; }
  else if (a === "tecOk") {
    if (T.modo === "dni") {
      const s = DB.socios.find(x => x.dni === T.val);
      if (!s) { toast("No encontramos ese DNI. Consultá en recepción.", "alerta"); T.val = ""; }
      else { teclado = null; setYo({rol:"socio", id:s.id}); pestana = "inicio"; sonar("listo"); }
    } else if (T.modo === "pin") {
      if (T.val === DB.pin) { teclado = null; setYo({rol:"staff"}); pestana = "panel"; sonar("listo"); } else { toast("PIN incorrecto", "alerta"); T.val = ""; vibrar(120); }
    } else if (T.modo === "kiosco") { const v = T.val; T.val = ""; return entradaKiosco(DB.socios.find(x => x.dni === v)); }
    else if (T.modo === "salirKiosco") {

    }
  }
  render();
}

/* ================= ESCANEAR QR (cámara) ================= */
let camStream = null;
async function escanear(modo){
  if (!("BarcodeDetector" in window)) return toast("Este navegador no puede escanear. Buscá al socio por nombre o DNI.", "info");
  let det; try { det = new BarcodeDetector({formats:["qr_code"]}); } catch { return toast("No se puede escanear en este dispositivo", "alerta"); }
  abrirCapa(`<div id="cam"><div class="row"><h2 class="sp">Escanear pase</h2>${cerrarX("cerrarCam")}</div>
    <p class="muted small" style="margin:4px 0 0">Apuntá la cámara al código QR del socio.</p><video playsinline muted></video></div>`);
  try { camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); } catch { cerrarCam(); return toast("No se pudo abrir la cámara. Revisá el permiso.", "alerta"); }
  const v = $("#cam video"); v.srcObject = camStream; await v.play().catch(() => {});
  const buscar = async () => {
    if (!camStream) return;
    try { const r = await det.detect(v); const code = r.map(x => x.rawValue).find(x => /^GBGYM:/.test(x)); if (code) { cerrarCam(); return leido(code.slice(6), modo); } } catch {}
    requestAnimationFrame(buscar);
  };
  buscar();
}
function cerrarCam(){ if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; cerrarCapa(); }
function leido(sid, modo){
  const s = socio(sid); if (!s) return toast("Ese pase no pertenece a este gimnasio", "alerta");
  if (modo === "kiosco") return entradaKiosco(s);
  confirmarEntrada(s.id);
}

    grupo("Comunicación", fila("avisos", "megafono", "Avisos", `${DB.avisos.length} publicado${DB.avisos.length === 1 ? "" : "s"}`) + fila("desafio", "trofeo", "Desafío del mes", `${DB.desafio.meta} visitas · ${esc(DB.desafio.premio)}`)) +
    grupo("Gimnasio", fila("marca", "imagen", "Marca", "Nombre, logo y color de la app") + fila("datos", "reloj", "Datos y horarios", esc(textoHorario())) + fila("planes", "etiqueta", "Planes y precios", `${DB.planes.length} planes`)) +
    grupo("Acceso", fila("recepcion", "monitor", "Modo recepción", "Tablet en la entrada para registrar ingresos") + fila("pin", "candado", "PIN de acceso", "Para ingresar como gimnasio")) +
    (DB.demo ? grupo("Demostración", fila("demo", "info", "Datos de ejemplo", "Restaurar la demostración")) : "") +
    `<button class="btn ghost" data-a="salir" style="margin-top:18px">${ic("salir")} Cerrar sesión</button>${firma()}`;
}
function hojaAjuste(k){
  const g = DB.gym, H = {
    avisos:`<h2>Avisos</h2><p class="sub" style="margin:4px 0 14px">Se muestran a todos los socios en el inicio de la app.</p>
      <textarea class="campo" id="aviso" placeholder="Ej.: El lunes feriado abrimos de 9 a 13"></textarea><button class="btn" data-a="publicarAviso" style="margin-top:10px">Publicar aviso</button>
      ${DB.avisos.length ? `<div class="lbl">Publicados</div>` : ""}${DB.avisos.map(a => `<div class="fila"><div class="sp" style="font-size:14px;color:var(--ink2)">${esc(a.txt)}<div class="sub tab">${fCorta(a.f)}</div></div><button class="ibtn" data-a="borrarAviso" data-id="${a.id}" aria-label="Eliminar">${ic("basura")}</button></div>`).join("")}`,
    desafio:`<h2>Desafío del mes</h2><p class="sub" style="margin:4px 0 0">Las visitas se cuentan automáticamente con cada ingreso. Los socios ven su avance y el ranking.</p>
      <div class="grid2"><div><div class="lbl">Visitas objetivo</div><input class="campo tab" id="dMeta" type="number" inputmode="numeric" value="${DB.desafio.meta}"></div><div><div class="lbl">Premio</div><input class="campo" id="dPremio" value="${esc(DB.desafio.premio)}"></div></div>
      <button class="btn" data-a="guardarDesafio" style="margin-top:16px">Guardar</button>`,
    marca:`<h2>Marca</h2><p class="sub" style="margin:4px 0 14px">La app se muestra con el nombre, el logo y el color de tu gimnasio.</p>
      <div class="row"><div class="logo" style="width:56px;height:56px;border-radius:14px;${logoCss()}"></div><label class="btn sec chico" style="cursor:pointer">${ic("camara")} Cambiar logo<input type="file" accept="image/*" id="logoIn" hidden></label>${g.logo ? `<button class="enlace" data-a="quitarLogo">Quitar</button>` : ""}</div>
      <div class="lbl">Nombre</div><input class="campo" id="gNombre" value="${esc(g.nombre)}">
      <div class="lbl">Color de marca</div><div class="row w" style="gap:8px">${Object.entries(COLORES).map(([n, c]) => `<button class="sw ${c.toLowerCase() === (g.color || "").toLowerCase() ? "on" : ""}" data-a="color" data-c="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join("")}</div>
      <button class="btn" data-a="guardarMarca" style="margin-top:16px">Guardar</button>`,
    datos:`<h2>Datos y horarios</h2>
      <div class="lbl">Dirección</div><input class="campo" id="gDir" value="${esc(g.direccion)}">
      <div class="grid2"><div><div class="lbl">WhatsApp</div><input class="campo" id="gWa" inputmode="tel" value="${esc(g.whatsapp)}"></div><div><div class="lbl">Alias de cobro</div><input class="campo" id="gAlias" value="${esc(g.alias)}"></div></div>
      <div class="lbl">Capacidad simultánea</div><input class="campo tab" id="gCap" type="number" inputmode="numeric" value="${g.capacidad}">
      <div class="lbl">Horario de atención</div>${[1,2,3,4,5,6,0].map(d => { const h = g.horario[d]; return `<div class="row" style="margin-top:6px"><span style="width:40px;font-size:13px;color:var(--ink2)">${DIA3[d]}</span><select class="campo" id="hA${d}" style="height:40px">${horasOpt(h ? h[0] : -1, true)}</select><span class="muted small">a</span><select class="campo" id="hC${d}" style="height:40px">${horasOpt(h ? h[1] : -1)}</select></div>`; }).join("")}
      <button class="btn" data-a="guardarMarca" style="margin-top:16px">Guardar</button>`,
    planes:`<h2>Planes y precios</h2><p class="sub" style="margin:4px 0 4px">Nombre del plan y precio mensual.</p>${DB.planes.map((p, i) => `<div class="row" style="margin-top:10px"><input class="campo" id="plN${i}" value="${esc(p.n)}" style="flex:2"><input class="campo tab" id="plP${i}" type="number" inputmode="numeric" value="${p.precio}" style="flex:1"></div>`).join("")}
      <div class="grid2" style="margin-top:14px"><button class="btn sec" data-a="agregarPlan">${ic("mas")} Agregar plan</button><button class="btn" data-a="guardarPlanes">Guardar</button></div>`,
    recepcion:`<h2>Modo recepción</h2><p class="sub" style="margin:4px 0 14px">Dejá una tablet o un celular en la entrada. Cada socio ingresa su DNI o muestra su QR y el ingreso queda registrado. Si la cuota está vencida, se lo indica. Para salir se pide el PIN.</p>
      <button class="btn" data-a="entrarKiosco">${ic("monitor")} Activar en este dispositivo</button>`,
    pin:`<h2>PIN de acceso</h2><p class="sub" style="margin:4px 0 14px">Es el código para entrar como gimnasio y para salir del modo recepción.</p>
      <input class="campo" id="nuevoPin" inputmode="numeric" placeholder="Nuevo PIN (4 a 6 números)"><button class="btn" data-a="cambiarPin" style="margin-top:12px">Cambiar PIN</button>`,
    demo:`<h2>Datos de ejemplo</h2><p class="sub" style="margin:4px 0 14px">La app está cargada con socios, pagos y clases de ejemplo. Podés volver a los datos originales cuando quieras.</p>
      <button class="btn no" data-a="reiniciar">${confirmarReinicio ? "Confirmar: restaurar datos de ejemplo" : "Restaurar datos de ejemplo"}</button>`
  };
  abrirHoja(H[k]);
}
function horasOpt(sel, conCerrado){ return (conCerrado ? `<option value="-1" ${sel === -1 ? "selected" : ""}>Cerrado</option>` : `<option value="-1" ${sel === -1 ? "selected" : ""}>—</option>`) + Array.from({length:24}, (_, h) => `<option value="${h}" ${h === sel ? "selected" : ""}>${pad(h)}:00</option>`).join(""); }
document.addEventListener("change", e => {
  if (e.target.id !== "logoIn" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => {
    const c = document.createElement("canvas"), L = 256; c.width = c.height = L; const x = c.getContext("2d");
    const s = Math.max(L / im.width, L / im.height), w = im.width * s, h = im.height * s; x.fillStyle = "#000"; x.fillRect(0, 0, L, L); x.drawImage(im, (L - w) / 2, (L - h) / 2, w, h);
    DB.gym.logo = c.toDataURL("image/jpeg", .85); guardar(); render(); hojaAjuste("marca"); toast("Logo actualizado");
  }; im.src = fr.result; };
  fr.readAsDataURL(e.target.files[0]);
});

/* ================= ACCIONES ================= */
function accion(a, b, ev){
  const id = b.dataset.id;
  if (a === "tab") { sonar("toque"); return ir(b.dataset.t); }
  if (a.startsWith("tec")) return tecla(a, b);
  if (a.startsWith("g") && a.length > 1 && a[1] === a[1].toUpperCase()) {
    if (a === "gElegir") { const ss = S(); ss.cambios[ss.i] = id || null; if (!id) delete ss.cambios[ss.i]; ss.serie = 0; guardar(); cerrarHoja(); return pintarGuia(); }
    return accionGuia(a, b);
  }
  switch (a) {
    case "entrarSocio": teclado = {modo:"dni", val:""}; return render();
    case "entrarStaff": teclado = {modo:"pin", val:""}; return render();
    case "entrarKiosco": cerrarHoja(); teclado = {modo:"kiosco", val:""}; setYo({rol:"kiosco"}); return render();
    case "salirKiosco": teclado = {modo:"salirKiosco", val:""}; return pintarTeclado();
    case "socioDemo": teclado = null; setYo({rol:"socio", id:"s1"}); pestana = "inicio"; return render();
    case "salir": setYo(null); teclado = null; pestana = null; return render();
    case "escanear": return escanear(b.dataset.modo);
    case "cerrarCam": return cerrarCam();
    case "cerrarCapa": return cerrarCapa();
    // socio
    case "pase": cerrarHoja(); return hojaPase();
    case "cuota": return hojaCuota();
    case "ocupacion": return hojaOcupacion();
    case "desafio": return hojaDesafio();
    case "verDia": return hojaDia(+b.dataset.d);
    case "ajuste": confirmarReinicio = false; return hojaAjuste(b.dataset.k);
    case "empezar": cerrarHoja(); return empezar(+b.dataset.d);
    case "continuar": return abrirGuia();
    case "fichaEj": return hojaFicha(id, b.dataset.dia);
    case "verPlantilla": return hojaRutina(id, "socio");
    case "cambiarRutina": { const s = socioYo(); abrirHoja(`<h2>Cambiar rutina</h2><p class="sub" style="margin:4px 0 6px">${s.rutina.por === "profe" ? "Esta rutina te la asignó tu profesor. Si la cambiás, avisale." : "Elegí otra rutina del gimnasio."}</p>${DB.rutinas.map(t => `<button class="fila" data-a="verPlantilla" data-id="${t.id}"><span class="av" style="${t.id === s.rutina.id ? "background:var(--ac);color:var(--acTxt)" : ""}">${ic(t.id === s.rutina.id ? "check" : "rutina")}</span><div class="sp"><b style="font-size:14px">${esc(t.n)}</b><div class="sub">${t.dias.length} días · ${esc(t.nivel)}</div></div><span class="der">${ic("der")}</span></button>`).join("")}`); return; }
    case "usarRutina": { const s = socioYo(); s.rutina = {id, sig:0, por:"socio"}; guardar(); cerrarHoja(); toast("Rutina seleccionada"); return ir("entrenar"); }
    case "diaClase": diaClase = +b.dataset.k; return render();
    case "reservar": {
      const s = socioYo(); if (estadoCuota(s).k === "venc") return toast("Tu cuota está vencida. Renovala para reservar.", "alerta");
      const k = id + "|" + b.dataset.f, c = DB.clases.find(x => x.id === id), l = DB.reservas[k] = DB.reservas[k] || [];
      if (l.length >= c.cupo) return toast("La clase ya no tiene lugares", "alerta");
      l.push(s.id); guardar(); sonar("listo"); toast(`Reserva confirmada: ${c.n}`); return render();
    }
    case "cancelarClase": { const k = id + "|" + b.dataset.f; DB.reservas[k] = (DB.reservas[k] || []).filter(x => x !== YO.id); guardar(); toast("Reserva cancelada", "info"); return render(); }
    // gimnasio
    case "hojaEntrada": return hojaEntrada();
    case "entradaDe": return confirmarEntrada(id);
    case "entradaForzada": return confirmarEntrada(id, true);
    case "recordatorios": return hojaRecordatorios();
    case "waEnviado": setTimeout(() => { const c = $("#wa-" + id); if (c) { c.innerHTML = ic("check") + " Abierto"; c.style.color = "var(--okT)"; } }, 300); return;
    case "verSocios": filtroSocios = b.dataset.f; busca = ""; return ir("socios");
    case "filtro": filtroSocios = b.dataset.f; return render();
    case "verSocio": confirmarBaja = null; return hojaSocio(id);
    case "nuevoSocio": return hojaFormSocio(null);
    case "editarSocio": return hojaFormSocio(id);
    case "guardarSocio": return guardarSocio(id || null);
    case "bajaSocio":
      if (confirmarBaja !== id) { confirmarBaja = id; return hojaSocio(id); }
      DB.socios = DB.socios.filter(s => s.id !== id); confirmarBaja = null; guardar(); cerrarHoja(); toast("Socio dado de baja", "info"); return render();
    case "pagar": return hojaPago(id);
    case "metodo": pagoMetodo = b.dataset.m; $$("[data-a=metodo]").forEach(x => x.classList.toggle("on", x === b)); return;
    case "confirmarPago": {
      const s = socio(id), monto = +$("#pMonto").value || 0; if (!monto) return toast("Ingresá el monto", "info");
      s.vence = sumarMes(s.vence < hoyStr() ? hoyStr() : s.vence);
      DB.pagos.push({id:uid("pg"), s:id, f:hoyStr(), monto, metodo:pagoMetodo}); guardar(); sonar("fin");
      toast(`Pago registrado · vence el ${fCorta(s.vence)}`); cerrarHoja(); return render();
    }
    case "elegirRutinaSocio": return hojaElegirRutinaSocio(id);
    case "asignarUna": { const s = socio(id); s.rutina = b.dataset.r ? {id:b.dataset.r, sig:0, por:"profe"} : null; guardar(); toast(b.dataset.r ? "Rutina asignada" : "Rutina quitada"); return hojaSocio(id); }
    case "verRutina": return hojaRutina(id, "staff");
    case "asignar": return hojaAsignar(id);
    case "toggleAsig": asigSel.has(id) ? asigSel.delete(id) : asigSel.add(id); return pintarAsignar();
    case "confirmarAsig": {
      let n = 0; DB.socios.forEach(s => { const tiene = s.rutina && s.rutina.id === asigRutina;
        if (asigSel.has(s.id) && !tiene) { s.rutina = {id:asigRutina, sig:0, por:"profe"}; n++; } else if (!asigSel.has(s.id) && tiene) s.rutina = null; });
      guardar(); cerrarHoja(); toast(n ? `Rutina asignada a ${n} socio${n === 1 ? "" : "s"}` : "Asignación guardada"); return render();
    }
    case "duplicarRutina": { const t = JSON.parse(JSON.stringify(rutinaDe(id))); t.id = uid("r"); t.n = t.n + " (copia)"; t.base = 0; DB.rutinas.unshift(t); guardar(); cerrarHoja(); toast("Copia creada"); return render(); }
    case "borrarRutina": {
      if (DB.rutinas.length <= 1) return toast("Tiene que quedar al menos una rutina", "info");
      const usan = DB.socios.filter(s => s.rutina && s.rutina.id === id);
      if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = usan.length ? `La usan ${usan.length}: confirmar` : "Confirmar eliminación"; return; }
      usan.forEach(s => s.rutina = null); DB.rutinas = DB.rutinas.filter(t => t.id !== id); guardar(); cerrarHoja(); toast("Rutina eliminada", "info"); return render();
    }
    case "nuevaRutina": return abrirEditor(null);
    case "editarRutina": cerrarHoja(); return abrirEditor(id);
    case "edCancelar": borr = null; return cerrarCapa();
    case "edGuardar": return guardarEditor();
    case "edAgregarDia": leerEditor(); borr.dias.push({n:"Día " + (borr.dias.length + 1), ej:[]}); return pintarEditor();
    case "edBorrarDia": leerEditor(); if (borr.dias.length <= 1) return toast("La rutina necesita al menos un día", "info"); borr.dias.splice(+b.dataset.i, 1); return pintarEditor();
    case "edSeries": { leerEditor(); const x = borr.dias[+b.dataset.i].ej[+b.dataset.k]; x[1] = Math.max(1, Math.min(10, x[1] + +b.dataset.d)); return pintarEditor(); }
    case "edMover": { leerEditor(); const L = borr.dias[+b.dataset.i].ej, k = +b.dataset.k; if (k > 0) [L[k - 1], L[k]] = [L[k], L[k - 1]]; return pintarEditor(); }
    case "edQuitar": leerEditor(); borr.dias[+b.dataset.i].ej.splice(+b.dataset.k, 1); return pintarEditor();
    case "edAgregarEj": leerEditor(); selDia = +b.dataset.i; return hojaSelector();
    case "edGrupo": selGrupo = b.dataset.g; if ($("#buscaEj")) $("#buscaEj").value = ""; return pintarSelector();
    case "edElegirEj": { const e = CATALOGO[id], def = e.tipo === "min" ? [id, 1, "10", 0] : e.tipo === "seg" ? [id, 3, "30", 45] : e.tipo === "pc" ? [id, 3, "12", 60] : [id, 3, "10–12", 90];
      borr.dias[selDia].ej.push(def); toast(`Agregado: ${e.n}`); pintarEditor(); return; }
    case "verClase": return hojaClase(id);
    case "editarClase": return hojaFormClase(id || null);
    case "cIco": leerClase(); borrClase.ico = b.dataset.i; return pintarFormClase();
    case "cDia": { leerClase(); const d = +b.dataset.d, L = borrClase.dias; L.includes(d) ? L.splice(L.indexOf(d), 1) : L.push(d); return pintarFormClase(); }
    case "guardarClase": {
      leerClase(); const c = borrClase;
      if (c.n.length < 2) return toast("Ingresá el nombre de la clase", "info"); if (!c.dias.length) return toast("Elegí al menos un día", "info"); if (!c.h) return toast("Elegí la hora", "info");
      if (c.id) { const i = DB.clases.findIndex(x => x.id === c.id); DB.clases[i] = c; } else { c.id = uid("c"); DB.clases.push(c); }
      guardar(); cerrarHoja(); toast("Clase guardada"); return render();
    }
    case "borrarClase":
      if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "Confirmar eliminación"; return; }
      DB.clases = DB.clases.filter(x => x.id !== borrClase.id); guardar(); cerrarHoja(); toast("Clase eliminada", "info"); return render();
    case "publicarAviso": { const t = $("#aviso").value.trim(); if (t.length < 3) return toast("Escribí el aviso", "info"); DB.avisos.unshift({id:uid("a"), f:hoyStr(), txt:t}); guardar(); toast("Aviso publicado"); render(); return hojaAjuste("avisos"); }
    case "borrarAviso": DB.avisos = DB.avisos.filter(x => x.id !== id); guardar(); render(); return hojaAjuste("avisos");
    case "guardarDesafio": DB.desafio = {meta:Math.max(1, +$("#dMeta").value || 12), premio:$("#dPremio").value.trim() || "Premio sorpresa"}; guardar(); cerrarHoja(); render(); return toast("Desafío guardado");
    case "color": DB.gym.color = b.dataset.c; guardar(); aplicarMarca(); $$(".sw").forEach(x => x.classList.toggle("on", x === b)); return;
    case "quitarLogo": DB.gym.logo = null; guardar(); render(); return hojaAjuste("marca");
    case "guardarMarca": {
      const g = DB.gym;
      if ($("#gNombre")) { const n = $("#gNombre").value.trim(); if (n.length < 2) return toast("Ingresá el nombre del gimnasio", "info"); g.nombre = n; }
      if ($("#hA1")) {
        const hor = {}; for (const d of [0,1,2,3,4,5,6]) { const a1 = +$("#hA" + d).value, c1 = +$("#hC" + d).value; if (a1 < 0) { hor[d] = null; continue; } if (c1 <= a1) return toast(`Revisá el horario del ${DIA[d].toLowerCase()}`, "alerta"); hor[d] = [a1, c1]; }
        Object.assign(g, {direccion:$("#gDir").value.trim(), whatsapp:$("#gWa").value.trim(), alias:$("#gAlias").value.trim(), capacidad:Math.max(1, +$("#gCap").value || 35), horario:hor});
      }
      guardar(); cerrarHoja(); toast("Cambios guardados"); return render();
    }
    case "agregarPlan": leerPlanes(); DB.planes.push({id:uid("p"), n:"Plan nuevo", precio:30000}); guardar(); render(); return hojaAjuste("planes");
    case "guardarPlanes": leerPlanes(); guardar(); cerrarHoja(); render(); return toast("Precios guardados");
    case "cambiarPin": { const p = $("#nuevoPin").value.replace(/\D/g, ""); if (p.length < 4 || p.length > 6) return toast("El PIN debe tener de 4 a 6 números", "info"); DB.pin = p; guardar(); cerrarHoja(); return toast("PIN actualizado"); }
    case "reiniciar":
      if (!confirmarReinicio) { confirmarReinicio = true; return hojaAjuste("demo"); }
      confirmarReinicio = false; DB = semilla(); guardar(); simular(); cerrarHoja(); toast("Datos de ejemplo restaurados"); return render();
  }
}
function leerPlanes(){ DB.planes.forEach((p, i) => { const n = $("#plN" + i), v = $("#plP" + i); if (n) p.n = n.value.trim() || p.n; if (v) p.precio = +v.value || p.precio; }); }

/* ================= ARRANQUE ================= */
render();
(() => { const i = $("#intro"); if (!i) return; let ido = false;
  const irse = () => { if (ido) return; ido = true; i.classList.add("fuera"); setTimeout(() => i.remove(), 550); };
  i.onclick = irse; setTimeout(irse, 2300); })();
if (YO && YO.rol === "socio" && socioYo()) { const ss = entrenoDe(YO.id).sesion; if (ss && ss.f === hoyStr() && ss.descansoHasta) abrirGuia(); }
// En la demo, cada minuto entran socios nuevos (ocupación en vivo) y se refresca la pantalla si no estás escribiendo
setInterval(() => {
  if (!DB.demo) return; simular();
  const escribiendo = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!escribiendo && !$("#capa").innerHTML && !$("#hoja").innerHTML && YO && YO.rol !== "kiosco") render();
}, 60000);
</script>
<script>
const VERSION_APP = "20260930153803";
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
  document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
}).catch(() => {}));
async function buscarVersionNueva(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    const v = (await r.json()).v;
    if (v && v !== VERSION_APP) avisarVersionNueva();
  } catch {}
}
function avisarVersionNueva(){
  if (document.getElementById("versionNueva") || document.getElementById("capa").innerHTML) return;
  const d = document.createElement("div"); d.id = "versionNueva";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;" +
    "background:#E4E7EC;color:#0B0C0E;padding:12px 14px;border-radius:16px;font:800 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4)";
  d.innerHTML = '<span style="flex:1">Hay una versión nueva de la app</span>';
  const b = document.createElement("button"); b.textContent = "Actualizar";
  b.style.cssText = "border:0;border-radius:12px;padding:9px 14px;font:800 15px system-ui,sans-serif;background:#0B0C0E;color:#E4E7EC";
  b.onclick = () => location.reload();
  d.append(b); document.body.append(d);
}
setTimeout(buscarVersionNueva, 4000);
setInterval(buscarVersionNueva, 20 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) buscarVersionNueva(); });
</script>

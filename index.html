<script>
"use strict";
/* ================= UTILIDADES ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyStr = () => fstr(new Date());
const deStr = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const sumarDias = (s, n) => { const d = deStr(s); d.setDate(d.getDate() + n); return fstr(d); };
const sumarMes = s => { const d = deStr(s), dia = d.getDate(); d.setMonth(d.getMonth() + 1); if (d.getDate() !== dia) d.setDate(0); return fstr(d); };
const diasEntre = (a, b) => Math.round((deStr(b) - deStr(a)) / 864e5);
const fCorta = s => { const d = deStr(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); };
const plata = n => "$" + Math.round(n || 0).toLocaleString("es-AR");
const fmtKg = kg => (Math.round(kg * 100) / 100).toString().replace(".", ",");
const DIA = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"], DIA3 = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const plural = d => /s$/.test(d) ? d : d + "s";
const inicial = n => (n || "?").split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
const corto = n => { const p = (n || "").split(" "); return p[0] + (p[1] ? " " + p[1][0] + "." : ""); };
const rutaFoto = (img, n) => "ejercicios/" + img + "/" + n + ".jpg";
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(t){ $$(".toast").forEach(x => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2800); }
function vibrar(p){ try { navigator.vibrate && navigator.vibrate(p); } catch {} }
const SND = {};

// Número aleatorio con semilla: los datos de ejemplo salen siempre iguales
function azar(semilla){ let a = semilla >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= DATOS ================= */
// Todo queda guardado en este dispositivo (versión de demostración). Con un servidor, DB pasa a vivir en la nube.
const K = "gbgym-v1", KS = "gbgym-yo";
const COLORES = {Plata:"#C9CED6", Naranja:"#FF8A3D", Rojo:"#FF5C6C", Azul:"#4DA3FF", Verde:"#3DDC84", Violeta:"#A98BFF", Amarillo:"#FFD23F", Rosa:"#FF7AC0"};
const ICONOS_CLASE = ["🚴","🔥","💃","🏋️","🧘","🥊","🤸","🏃","💪","🧗"];
let DB = cargar(), YO = cargarYo();
function cargar(){ try { return JSON.parse(localStorage.getItem(K)); } catch { return null; } }
function guardar(){ try { localStorage.setItem(K, JSON.stringify(DB)); } catch { toast("No se pudo guardar: memoria llena"); } }
function cargarYo(){ try { return JSON.parse(localStorage.getItem(KS)); } catch { return null; } }
function setYo(y){ YO = y; try { y ? localStorage.setItem(KS, JSON.stringify(y)) : localStorage.removeItem(KS); } catch {} }

// Horario de apertura: [abre, cierra] por día (0 = domingo). null = cerrado.
const HORARIO_BASE = {0:null, 1:[7,23], 2:[7,23], 3:[7,23], 4:[7,23], 5:[7,23], 6:[9,13]};
// Entradas por hora de un gimnasio típico (para los datos de ejemplo)
const RITMO = {7:4, 8:6, 9:6, 10:4, 11:3, 12:3, 13:2, 14:2, 15:3, 16:4, 17:6, 18:9, 19:10, 20:8, 21:4, 22:1};
const RITMO_SAB = {9:6, 10:8, 11:8, 12:4};

function semilla(){
  const r = azar(20261001), hoy = hoyStr();
  const nom = ["Martín","Lucía","Sofía","Mateo","Valentina","Juan","Camila","Tomás","Julieta","Nicolás","Agustina","Facundo","Florencia","Lautaro","Micaela","Santiago","Carolina","Joaquín","Paula","Franco","Antonella","Gonzalo","Rocío","Ignacio","Belén","Emiliano","Milagros","Federico","Daniela","Bruno","Abril","Ramiro","Luciana","Matías","Victoria","Diego","Candela","Pablo","Brenda","Alejo"];
  const ape = ["Gómez","Rodríguez","Fernández","López","Martínez","Pérez","García","Sánchez","Romero","Sosa","Torres","Álvarez","Ruiz","Ramírez","Flores","Acosta","Benítez","Medina","Herrera","Suárez","Aguirre","Giménez","Molina","Castro","Ortiz","Silva","Rojas","Luna","Juárez","Cabrera"];
  const planes = [{id:"p1", n:"Musculación 3 veces por semana", precio:25000}, {id:"p2", n:"Musculación libre", precio:32000}, {id:"p3", n:"Pase libre + clases", precio:40000}];
  const rutinas = PLANTILLAS.map(t => JSON.parse(JSON.stringify({...t, base:1})));
  const socios = [];
  for (let i = 0; i < 120; i++) {
    const nombre = i === 0 ? "Martín Gómez" : nom[Math.floor(r() * nom.length)] + " " + ape[Math.floor(r() * ape.length)];
    let venceEn = Math.floor(r() * 30) + 1;
    if (i === 0) venceEn = 3; else if (r() < .1) venceEn = -Math.floor(r() * 20) - 1; else if (r() < .08) venceEn = Math.floor(r() * 4);
    const plan = planes[r() < .35 ? 0 : r() < .6 ? 1 : 2].id;
    socios.push({id:"s" + (i + 1), nombre, dni:i === 0 ? "35123456" : String(28000000 + Math.floor(r() * 17000000)),
      tel:"2604" + String(100000 + Math.floor(r() * 899999)), plan, vence:sumarDias(hoy, venceEn),
      alta:sumarDias(hoy, -Math.floor(r() * 700) - 20), rutina:r() < .7 || i === 0 ? {id:i === 0 ? "t-hiper4" : rutinas[Math.floor(r() * rutinas.length)].id, sig:i === 0 ? 2 : 0, por:"profe"} : null});

function simular(){

  const activos = DB.socios.filter(s => s.id !== "s1");
  let t = new Date(DB.simHasta); t.setMinutes(0, 0, 0);
  const yaHoy = {};

    const dow = t.getDay(), h = t.getHours(), f = fstr(t), rit = dow === 0 ? 0 : (dow === 6 ? RITMO_SAB : RITMO)[h] || 0;
    const n = Math.round(rit * (.75 + r() * .5));
    for (let k = 0; k < n; k++) {
      const ts = t.getTime() + Math.floor(r() * 3600e3);
      if (ts <= DB.simHasta || ts > ahora) continue;
      const s = activos[Math.floor(r() * activos.length)];
      if (diasEntre(s.vence, f) > 10) continue;           // los que dejaron de pagar hace rato no vienen
      const clave = s.id + f; if (yaHoy[clave]) continue; yaHoy[clave] = 1;
      DB.asistencias.push({s:s.id, t:ts});
    }
    t = new Date(t.getTime() + 3600e3);
  }
  DB.simHasta = ahora;
  const corte = ahora - 120 * 864e5;
  DB.asistencias = DB.asistencias.filter(a => a.t >= corte).sort((a, b) => a.t - b.t);
  guardar();
}

/* ================= ESCANEAR QR (cámara) ================= */
let camStream = null;
async function escanear(modo){
  if (!("BarcodeDetector" in window)) return toast("Este navegador no puede escanear: buscá al socio por nombre o DNI");
  let det; try { det = new BarcodeDetector({formats:["qr_code"]}); } catch { return toast("No se puede escanear en este dispositivo"); }
  abrirCapa(`<div id="cam"><div class="row"><h2 class="sp">📷 Escaneá el pase</h2><button class="chip" data-a="cerrarCam">✕ Cerrar</button></div>
    <p class="muted">Apuntá la cámara al código QR del socio.</p><video playsinline muted></video></div>`);
  try { camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); } catch { cerrarCam(); return toast("No se pudo abrir la cámara (revisá el permiso)"); }
  const v = $("#cam video"); v.srcObject = camStream; await v.play().catch(() => {});
  const buscar = async () => {
    if (!camStream) return;
    try { const r = await det.detect(v); const code = r.map(x => x.rawValue).find(x => /^GBGYM:/.test(x)); if (code) { cerrarCam(); return leido(code.slice(6), modo); } } catch {}
    requestAnimationFrame(buscar);
  };
  buscar();
}
function cerrarCam(){ if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; cerrarCapa(); }
function leido(sid, modo){
  const s = socio(sid); if (!s) return toast("Ese pase no es de este gimnasio");
  if (modo === "kiosco") return entradaKiosco(s);
  confirmarEntrada(s.id);
}

function tarjetaHoyToca(s){
  const R = s.rutina && rutinaDe(s.rutina.id);
  if (!R) return `<div class="card"><b>🏋️ Todavía no tenés rutina</b><p class="muted small" style="margin:4px 0 10px">Elegí una lista para empezar hoy o pedile una a medida a tu profe.</p><button class="btn sec" data-a="tab" data-t="entrenar">Elegir rutina</button></div>`;
  const E = entrenoDe(s.id);
  if (E.sesion && E.sesion.f === hoyStr()) return `<div class="card"><b>⏸️ Tenés un entrenamiento a medias</b><p class="muted small" style="margin:4px 0 10px">${esc(R.dias[E.sesion.dia].n)} · seguí donde lo dejaste.</p><button class="btn ok" data-a="continuar">Continuar ▶</button></div>`;
  if (E.dias[hoyStr()]) return `<div class="card"><b>✅ Hoy ya entrenaste: ${esc(E.dias[hoyStr()])}</b><p class="muted small" style="margin:4px 0 0">¡Bien ahí! La próxima te toca ${esc(R.dias[(s.rutina.sig || 0) % R.dias.length].n)}.</p></div>`;
  const i = (s.rutina.sig || 0) % R.dias.length, D = R.dias[i];
  return `<div class="card"><div class="lbl" style="margin:0 0 2px">Hoy te toca</div><h2>${esc(D.n)}</h2>
    <p class="muted small" style="margin:2px 0 10px">${esc(R.n)} · ${D.ej.length} ejercicios · ~${duracionDia(D)} min</p>
    <button class="btn ok" data-a="empezar" data-d="${i}">▶ Empezar entrenamiento</button></div>`;
}
function tarjetaOcupacion(){
  const o = nivelOcupacion();
  return `<div class="card"><b>📍 ¿Cómo está el gimnasio ahora?</b>
    <div class="row" style="margin:10px 0 8px"><span class="dot" style="background:${o.col}"></span><b style="font-size:21px">${o.txt}</b><span class="sp"></span>${o.cerrado ? "" : `<span class="muted">${o.n} ${o.n === 1 ? "persona" : "personas"}</span>`}</div>
    ${o.cerrado ? `<div class="small muted">🕐 ${esc(textoHorario())}</div>` : `<div class="barra"><i style="width:${Math.max(4, Math.min(100, o.p * 100))}%;background:${o.col}"></i></div>`}
    <div class="small muted" style="margin-top:8px">💡 Mejor momento para venir: ${mejorHorario()}</div></div>`;
}
function tarjetaDesafio(s){
  const rk = ranking(), mio = rk.find(x => x[0] === s.id), vis = mio ? mio[1] : 0, pos = mio ? rk.indexOf(mio) + 1 : null, meta = DB.desafio.meta;
  return `<div class="card"><div class="row"><b class="sp">🏆 Desafío de ${MES[new Date().getMonth()]}</b><span class="chip ac">${Math.min(vis, meta)}/${meta}</span></div>
    <p class="small muted" style="margin:4px 0 8px">Vení ${meta} veces este mes y participás por: <b style="color:var(--ink)">${esc(DB.desafio.premio)}</b></p>
    <div class="barra"><i style="width:${Math.min(100, vis / meta * 100)}%"></i></div>
    <p class="small" style="margin:8px 0 0">${vis >= meta ? "🎉 ¡Lo cumpliste! Ya estás participando." : `Te faltan <b>${meta - vis}</b> visitas.`}${pos ? ` Vas <b>${pos}.º</b> en el ranking.` : ""}</p>
    <details style="margin-top:8px"><summary class="small muted">Ver ranking del mes</summary>
    ${rk.slice(0, 5).map(([id, n], k) => `<div class="row small" style="padding:5px 0;${id === s.id ? "color:var(--ac2)" : ""}"><b style="width:22px">${["🥇","🥈","🥉"][k] || k + 1 + "."}</b><span class="sp">${esc(corto(socio(id).nombre))}${id === s.id ? " (vos)" : ""}</span><b>${n}</b></div>`).join("")}</details></div>`;
}
function proximaReserva(sid){
  for (let k = 0; k < 8; k++) {
    const f = sumarDias(hoyStr(), k), dow = deStr(f).getDay();
    const cs = DB.clases.filter(c => c.dias.includes(dow) && claseReservas(c.id, f).includes(sid) && !claseYaPaso(c, f)).sort((a, b) => a.h.localeCompare(b.h));
    if (cs.length) return {c:cs[0], f};
  }
  return null;
}
function tarjetaMiClase(s){
  const r = proximaReserva(s.id); if (!r) return "";
  const k = diasEntre(hoyStr(), r.f);
  return `<div class="card"><div class="row"><span style="font-size:28px">${r.c.ico}</span><div class="sp"><div class="lbl" style="margin:0">Tu próxima clase</div><b>${esc(r.c.n)} · ${k === 0 ? "hoy" : k === 1 ? "mañana" : DIA[deStr(r.f).getDay()].toLowerCase()} ${r.c.h}</b></div><button class="chip" data-a="tab" data-t="clases">Ver</button></div></div>`;
}
function tarjetaAvisos(){
  if (!DB.avisos.length) return "";
  return `<div class="card"><b>📣 Avisos del gimnasio</b>${DB.avisos.slice(0, 3).map(a => `<div class="fila" style="display:block"><div>${esc(a.txt)}</div><div class="small muted">${fCorta(a.f)}</div></div>`).join("")}</div>`;
}

/* ================= SOCIO: ENTRENAR ================= */
function entrenoDe(sid){ return DB.entrenos[sid] || (DB.entrenos[sid] = {hist:{}, dias:{}, sesion:null}); }
const itemEj = x => ({id:x[0], s:x[1], r:String(x[2]), d:x[3], ...CATALOGO[x[0]], tipo:CATALOGO[x[0]].tipo || "kg"});
function duracionDia(D){ return Math.round(D.ej.reduce((t, x) => { const e = itemEj(x); return t + (e.tipo === "min" ? +e.r || 10 : e.s * (0.8 + (e.d || 60) / 60)); }, 0) + 8); }
function objetivoTxt(e){ return e.tipo === "min" ? `${e.r} min` : e.tipo === "seg" ? `${e.s} × ${e.r} seg` : `${e.s} × ${e.r}`; }
function pEntrenar(){
  const s = socioYo(), R = s.rutina && rutinaDe(s.rutina.id);
  if (!R) return cabecera("Entrenar") + `<div class="card hero"><h2>Elegí una rutina para empezar</h2><p class="muted" style="margin:4px 0 0">Son rutinas armadas por profesores. Tu profe también te puede asignar una a medida y te aparece acá sola.</p></div>` +
    DB.rutinas.map(t => tarjetaRutina(t, "verPlantilla")).join("");
  const sig = (s.rutina.sig || 0) % R.dias.length, E = entrenoDe(s.id);
  return cabecera("Entrenar") + `<div class="card hero"><div class="lbl" style="margin:0">Tu rutina</div><h2>${esc(R.n)}</h2>
    <p class="muted small" style="margin:2px 0 8px">${s.rutina.por === "profe" ? "👨‍🏫 Asignada por tu profe" : "Elegida por vos"} · ${R.dias.length} días · ${esc(R.nivel)}</p>
    <button class="chip" data-a="cambiarRutina">🔄 Cambiar de rutina</button></div>
    ${R.dias.map((D, i) => `<div class="card" style="${i === sig ? "border-color:var(--ac)" : ""}">
      <div class="row"><div class="sp">${i === sig ? `<div class="lbl" style="margin:0;color:var(--ac2)">👉 Te toca hoy</div>` : ""}<h3>${esc(D.n)}</h3><div class="small muted">${D.ej.length} ejercicios · ~${duracionDia(D)} min</div></div></div>
      ${D.ej.map(x => { const e = itemEj(x); return `<button class="fila" data-a="fichaEj" data-id="${e.id}"><img class="mini" src="${rutaFoto(e.img, 1)}" alt="" loading="lazy"><div class="sp"><b>${esc(e.n)}</b><div class="small muted">${objetivoTxt(e)} · ${esc(GRUPOS[e.g])}</div></div><span class="muted">›</span></button>`; }).join("")}
      <button class="btn ${i === sig ? "ok" : "sec"}" data-a="empezar" data-d="${i}" style="margin-top:10px">${E.sesion && E.sesion.dia === i && E.sesion.f === hoyStr() ? "Continuar ▶" : "▶ Empezar " + esc(D.n)}</button></div>`).join("")}`;
}
function tarjetaRutina(t, accionV){
  const usan = DB.socios.filter(s => s.rutina && s.rutina.id === t.id).length;
  return `<button class="card" data-a="${accionV}" data-id="${t.id}" style="display:block;width:100%;text-align:left">
    <div class="row"><div class="sp"><h3>${esc(t.n)}</h3><div class="small muted">${t.dias.length} días · ${esc(t.nivel)}${YO.rol === "staff" ? ` · ${usan} socio${usan === 1 ? "" : "s"}` : ""}</div></div><span class="chip">${t.base ? "Lista" : "Del gimnasio"}</span></div>
    <p class="small" style="margin:8px 0 0">${esc(t.meta || "")}</p>
    <div class="row" style="margin-top:10px;gap:6px">${t.dias[0].ej.slice(0, 5).map(x => `<img class="mini" style="width:48px;height:38px" src="${rutaFoto(CATALOGO[x[0]].img, 1)}" alt="" loading="lazy">`).join("")}</div></button>`;
}
function hojaRutina(id, modo){
  const t = rutinaDe(id); if (!t) return;
  abrirHoja(`<h2>${esc(t.n)}</h2><p class="muted small" style="margin:2px 0 6px">${t.dias.length} días · ${esc(t.nivel)} · ${esc(t.meta || "")}</p>
    ${t.dias.map(D => `<div class="lbl">${esc(D.n)} · ~${duracionDia(D)} min</div>${D.ej.map(x => { const e = itemEj(x); return `<div class="fila"><img class="mini" src="${rutaFoto(e.img, 1)}" alt="" loading="lazy"><div class="sp"><b>${esc(e.n)}</b><div class="small muted">${objetivoTxt(e)}</div></div></div>`; }).join("")}`).join("")}
    ${modo === "socio" ? `<button class="btn ok" data-a="usarRutina" data-id="${t.id}" style="margin-top:14px">✓ Usar esta rutina</button>` :
      `<div class="grid2" style="margin-top:14px"><button class="btn" data-a="asignar" data-id="${t.id}">👥 Asignar</button><button class="btn sec" data-a="editarRutina" data-id="${t.id}">✏️ Editar</button></div>
       <div class="grid2" style="margin-top:10px"><button class="btn sec" data-a="duplicarRutina" data-id="${t.id}">📄 Duplicar</button><button class="btn no" data-a="borrarRutina" data-id="${t.id}">🗑 Borrar</button></div>`}`);
}
function hojaFicha(id){
  const e = CATALOGO[id]; if (!e) return;
  abrirHoja(`<h2>${esc(e.n)}</h2><div class="row w" style="margin-top:6px"><span class="chip">🛠️ ${esc(e.eq)}</span><span class="chip">🎯 ${esc(GRUPOS[e.g])}</span></div>
    ${fotoEj(e)}<p style="margin:10px 0 0">💬 ${esc(e.tip)}</p>`);
}
const fotoEj = e => `<div class="foto"><img src="${rutaFoto(e.img, 0)}" alt=""><img class="b" src="${rutaFoto(e.img, 1)}" alt=""><span class="et a2">① Inicio</span><span class="et b">② Final</span></div>`;

/* ----- Entrenamiento guiado ----- */
let reloj = null, wake = null;
const S = () => entrenoDe(YO.id).sesion;
function ejSesion(ss, i){
  const R = rutinaDe(ss.rid), x = R.dias[ss.dia].ej[i]; if (!x) return null;
  const e = itemEj(x), cambio = ss.cambios && ss.cambios[i];
  return cambio ? {...e, ...CATALOGO[cambio], tipo:CATALOGO[cambio].tipo || "kg", id:cambio, orig:e.id} : e;
}
function empezar(dia){
  const s = socioYo(), E = entrenoDe(s.id);
  if (!(E.sesion && E.sesion.f === hoyStr() && E.sesion.dia === dia && E.sesion.rid === s.rutina.id))
    E.sesion = {f:hoyStr(), rid:s.rutina.id, dia, i:-1, serie:0, sets:{}, cambios:{}, desde:Date.now()};
  guardar(); abrirGuia();
}
async function pedirPantalla(){ try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
function abrirGuia(){ pedirPantalla(); pintarGuia(); }
function cerrarGuia(){ clearInterval(reloj); reloj = null; try { wake && wake.release(); } catch {} wake = null; cerrarCapa(); cerrarHoja(); render(); }
function ultimaVez(id){ const h = entrenoDe(YO.id).hist[id]; return h && h.length ? h[h.length - 1] : null; }
const rangoReps = r => { const p = String(r).split(/[–-]/).map(n => parseInt(n, 10)); return [p[0] || 10, p[p.length - 1] || p[0] || 10]; };
function sugerencia(e){
  const u = ultimaVez(e.id); if (!u || !u.sets.length) return null;
  const [, rmax] = rangoReps(e.r), kg = Math.max(...u.sets.map(x => x.kg || 0)), paso = ["hombros","biceps","triceps"].includes(e.g) ? 1 : 2.5;
  const txtU = e.tipo === "pc" ? u.sets.map(x => x.reps).join(" · ") + " reps" : `${fmtKg(kg)} kg × ${u.sets.map(x => x.reps).join(" · ")}`;
  const todas = u.sets.length >= e.s && u.sets.every(x => x.reps >= rmax);
  if (e.tipo === "pc") return {txtU, kg:0, txt:todas ? "La vez pasada completaste todo: intentá sumar 1 o 2 repeticiones." : "Buscá sumar al menos una repetición."};
  return todas ? {txtU, kg:kg + paso, txt:`La vez pasada completaste todo: probá con ${fmtKg(kg + paso)} kg.`} : {txtU, kg, txt:`Repetí ${fmtKg(kg)} kg y buscá sumar una repetición.`};
}
function pintarGuia(){
  clearInterval(reloj); reloj = null;
  const ss = S(); if (!ss) return cerrarGuia();
  const R = rutinaDe(ss.rid), D = R && R.dias[ss.dia]; if (!D) { entrenoDe(YO.id).sesion = null; guardar(); return cerrarGuia(); }
  const arriba = `<div class="row"><button class="chip" data-a="gSalir">✕ Salir</button><span class="sp"></span><span class="chip">${esc(D.n)}</span></div>
    <div class="prog">${D.ej.map((_, i) => `<i class="${i < ss.i ? "ok" : i === ss.i ? "on" : ""}"></i>`).join("")}</div>`;
  if (ss.descansoHasta) return pintarDescanso(arriba, D);
  if (ss.i >= D.ej.length) return resumenFinal(D);
  let h;
  if (ss.i === -1) {
    h = `${arriba}<div class="centro" style="padding:14px 0"><div style="font-size:60px">🔥</div><h1>Entrada en calor</h1><p class="muted">10 minutos. Cuida tus articulaciones y rendís más.</p></div>
      <div class="card"><div class="fila"><span class="av">1</span><div><b>5 min de cardio suave</b><div class="small muted">Bici o cinta, a un ritmo en el que puedas charlar.</div></div></div>
      <div class="fila"><span class="av">2</span><div><b>3 min de movilidad</b><div class="small muted">Círculos de hombros, cadera, rodillas y muñecas.</div></div></div>
      <div class="fila"><span class="av">3</span><div><b>1 o 2 series livianas</b><div class="small muted">Del primer ejercicio: ${esc(ejSesion(ss, 0).n)}.</div></div></div></div>
      <button class="btn" data-a="gArrancar">Listo, arranquemos 💪</button>`;
  } else {
    const e = ejSesion(ss, ss.i), hechos = ss.sets[e.id] || [], sg = sugerencia(e);
    const kgPrevio = hechos.length ? hechos[hechos.length - 1].kg : sg ? sg.kg : "";
    const [, rmax] = rangoReps(e.r), repsPrevio = hechos.length ? hechos[hechos.length - 1].reps : rmax;
    const tiempo = e.tipo === "seg" || e.tipo === "min";
    h = `${arriba}<div class="small muted" style="font-weight:800">EJERCICIO ${ss.i + 1} DE ${D.ej.length}</div>
      <h1 style="font-size:30px;line-height:1.05;margin:4px 0 8px">${esc(e.n)}</h1>
      <div class="row w"><span class="chip">🛠️ ${esc(e.eq)}</span>${e.orig ? `<span class="chip ac">🔁 reemplazo</span>` : ""}</div>
      ${fotoEj(e)}<p class="small" style="margin:8px 0 0">💬 ${esc(e.tip)}</p>
      <button class="btn no chico" data-a="gCambiar" style="width:100%;margin-top:10px">🔁 La máquina está ocupada / no puedo hacerlo</button>
      <div class="objetivo"><div><b>${e.tipo === "min" ? "—" : `${Math.min(ss.serie + 1, e.s)}/${e.s}`}</b><small>SERIE</small></div><div><b>${e.tipo === "min" ? e.r + " min" : e.tipo === "seg" ? e.r + " s" : e.r}</b><small>${e.tipo === "min" ? "TIEMPO" : e.tipo === "seg" ? "SOSTENER" : "REPETICIONES"}</small></div></div>
      ${sg ? `<div class="consejo">🕘 La vez pasada: <b>${sg.txtU}</b><br>💡 ${sg.txt}</div>` : e.tipo === "kg" ? `<div class="consejo">💡 Primera vez: elegí un peso que puedas mover ${e.r} veces con buena técnica, dejando 2 repeticiones de reserva.</div>` : ""}
      ${tiempo ? `<button class="btn sec" data-a="gCrono" data-t="${e.tipo === "min" ? (+e.r || 10) * 60 : +e.r || 30}" style="margin-top:14px">⏱️ Iniciar ${e.tipo === "min" ? e.r + " minutos" : e.r + " segundos"}</button><div id="crono" class="centro" style="font:800 48px var(--fd);margin-top:8px"></div>` :
        `${e.tipo === "kg" ? `<div class="lbl">Peso que usaste (kg)</div><div class="num-in"><button data-a="gMas" data-c="gKg" data-d="-${["hombros","biceps","triceps"].includes(e.g) ? 1 : 2.5}">−</button><input id="gKg" type="number" inputmode="decimal" step="0.5" value="${kgPrevio}" placeholder="kg"><button data-a="gMas" data-c="gKg" data-d="${["hombros","biceps","triceps"].includes(e.g) ? 1 : 2.5}">+</button></div>` : ""}
        <div class="lbl">Repeticiones que hiciste</div><div class="num-in"><button data-a="gMas" data-c="gRep" data-d="-1">−</button><input id="gRep" type="number" inputmode="numeric" value="${repsPrevio}"><button data-a="gMas" data-c="gRep" data-d="1">+</button></div>`}
      <button class="btn ok" data-a="gSerie" style="margin-top:16px">✓ ${e.tipo === "min" ? "Terminé el cardio" : `Terminé la serie ${Math.min(ss.serie + 1, e.s)}`}</button>
      ${hechos.length ? `<div class="series">${hechos.map((x, i) => `<div class="serie"><span>Serie ${i + 1}</span><span>${e.tipo === "kg" ? `${fmtKg(x.kg)} kg × ${x.reps}` : e.tipo === "pc" ? `${x.reps} reps` : "✓"}</span></div>`).join("")}</div>` : ""}
      <div class="row" style="margin-top:14px"><button class="btn sec chico" data-a="gAtras">← Anterior</button><span class="sp"></span><button class="btn sec chico" data-a="gSaltar">Saltar →</button></div>`;
  }

    <div class="card"><b>🖥️ Modo recepción</b><p class="small muted" style="margin:2px 0 10px">Dejá una tablet o un celular en la entrada: cada socio pone su DNI (o muestra su QR) y queda registrada la entrada. Si la cuota está vencida, le avisa.</p><button class="btn sec" data-a="entrarKiosco">Activar modo recepción</button></div>
    <div class="card"><b>🔐 PIN del gimnasio</b><div class="row" style="margin-top:8px"><input class="campo" id="nuevoPin" inputmode="numeric" placeholder="Nuevo PIN (4 a 6 números)"><button class="btn sec chico" data-a="cambiarPin" style="flex:none">Cambiar</button></div></div>
    ${DB.demo ? `<div class="card"><b>🧪 Demostración</b><p class="small muted" style="margin:2px 0 10px">Los datos son de ejemplo. Podés volver a los datos originales cuando quieras.</p><button class="btn no" data-a="reiniciar">${confirmarReinicio ? "⚠️ Tocá de nuevo para reiniciar" : "Reiniciar datos de ejemplo"}</button></div>` : ""}
    <button class="btn sec" data-a="salir">Cerrar sesión</button>`;
}
function horasOpt(sel, conCerrado){ return (conCerrado ? `<option value="-1" ${sel === -1 ? "selected" : ""}>Cerrado</option>` : `<option value="-1" ${sel === -1 ? "selected" : ""}>—</option>`) + Array.from({length:24}, (_, h) => `<option value="${h}" ${h === sel ? "selected" : ""}>${h}:00</option>`).join(""); }
document.addEventListener("change", e => {
  if (e.target.id !== "logoIn" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => {
    const c = document.createElement("canvas"), L = 256; c.width = c.height = L; const x = c.getContext("2d");
    const s = Math.max(L / im.width, L / im.height), w = im.width * s, h = im.height * s; x.fillStyle = "#000"; x.fillRect(0, 0, L, L); x.drawImage(im, (L - w) / 2, (L - h) / 2, w, h);
    DB.gym.logo = c.toDataURL("image/jpeg", .85); guardar(); render(); toast("✅ Logo actualizado");
  }; im.src = fr.result; };
  fr.readAsDataURL(e.target.files[0]);
});

/* ================= ACCIONES ================= */
function accion(a, b, ev){
  const id = b.dataset.id;
  if (a === "tab") { sonar("toque"); return ir(b.dataset.t); }
  if (a.startsWith("tec")) return tecla(a, b);
  if (a.startsWith("g") && a.length > 1 && a[1] === a[1].toUpperCase()) {
    if (a === "gElegir") { const ss = S(); ss.cambios[ss.i] = id || null; if (!id) delete ss.cambios[ss.i]; ss.serie = 0; guardar(); cerrarHoja(); return pintarGuia(); }
    return accionGuia(a, b);
  }
  switch (a) {
    case "entrarSocio": teclado = {modo:"dni", val:""}; return render();
    case "entrarStaff": teclado = {modo:"pin", val:""}; return render();
    case "entrarKiosco": cerrarHoja(); teclado = {modo:"kiosco", val:""}; setYo({rol:"kiosco"}); return render();
    case "salirKiosco": teclado = {modo:"salirKiosco", val:""}; return pintarTeclado();
    case "socioDemo": teclado = null; setYo({rol:"socio", id:"s1"}); pestana = "inicio"; return render();
    case "salir": setYo(null); teclado = null; pestana = null; return render();
    case "escanear": return escanear(b.dataset.modo);
    case "cerrarCam": return cerrarCam();
    case "cerrarCapa": return cerrarCapa();
    // socio
    case "pase": return hojaPase();
    case "empezar": return empezar(+b.dataset.d);
    case "continuar": return abrirGuia();
    case "fichaEj": return hojaFicha(id);
    case "verPlantilla": return hojaRutina(id, "socio");
    case "cambiarRutina": { const s = socioYo(); abrirHoja(`<h2>Cambiar de rutina</h2><p class="muted small" style="margin:4px 0 8px">${s.rutina.por === "profe" ? "⚠️ Esta rutina te la asignó tu profe. Si la cambiás, avisale." : "Elegí otra rutina."}</p>${DB.rutinas.map(t => `<button class="fila" data-a="verPlantilla" data-id="${t.id}"><span style="font-size:22px">${t.id === s.rutina.id ? "✅" : "📋"}</span><div class="sp"><b>${esc(t.n)}</b><div class="small muted">${t.dias.length} días · ${esc(t.nivel)}</div></div><span class="muted">›</span></button>`).join("")}`); return; }
    case "usarRutina": { const s = socioYo(); s.rutina = {id, sig:0, por:"socio"}; guardar(); cerrarHoja(); toast("✅ Rutina elegida: ¡a entrenar!"); return ir("entrenar"); }
    case "diaClase": diaClase = +b.dataset.k; return render();
    case "reservar": {
      const s = socioYo(); if (estadoCuota(s).k === "venc") return toast("💳 Tu cuota está vencida: renovala para reservar");
      const k = id + "|" + b.dataset.f, c = DB.clases.find(x => x.id === id), l = DB.reservas[k] = DB.reservas[k] || [];
      if (l.length >= c.cupo) return toast("Se llenó justo 😕");
      l.push(s.id); guardar(); sonar("listo"); toast(`✅ Reservaste ${c.n}`); return render();
    }
    case "cancelarClase": { const k = id + "|" + b.dataset.f; DB.reservas[k] = (DB.reservas[k] || []).filter(x => x !== YO.id); guardar(); toast("Reserva cancelada"); return render(); }
    // gimnasio
    case "hojaEntrada": return hojaEntrada();
    case "entradaDe": return confirmarEntrada(id);
    case "entradaForzada": return confirmarEntrada(id, true);
    case "recordatorios": return hojaRecordatorios();
    case "waEnviado": setTimeout(() => { const c = $("#wa-" + id); if (c) { c.textContent = "✓ Abierto"; c.style.color = "var(--ok)"; } }, 300); return;
    case "verSocios": filtroSocios = b.dataset.f; busca = ""; return ir("socios");
    case "filtro": filtroSocios = b.dataset.f; return render();
    case "verSocio": confirmarBaja = null; return hojaSocio(id);
    case "nuevoSocio": return hojaFormSocio(null);
    case "editarSocio": return hojaFormSocio(id);
    case "guardarSocio": return guardarSocio(id || null);
    case "bajaSocio":
      if (confirmarBaja !== id) { confirmarBaja = id; return hojaSocio(id); }
      DB.socios = DB.socios.filter(s => s.id !== id); confirmarBaja = null; guardar(); cerrarHoja(); toast("Socio dado de baja"); return render();
    case "pagar": return hojaPago(id);
    case "metodo": pagoMetodo = b.dataset.m; $$("[data-a=metodo]").forEach(x => x.classList.toggle("on", x === b)); return;
    case "confirmarPago": {
      const s = socio(id), monto = +$("#pMonto").value || 0; if (!monto) return toast("Anotá el monto");
      s.vence = sumarMes(s.vence < hoyStr() ? hoyStr() : s.vence);
      DB.pagos.push({id:uid("pg"), s:id, f:hoyStr(), monto, metodo:pagoMetodo}); guardar(); sonar("fin");
      toast(`✅ Pago registrado · vence el ${fCorta(s.vence)}`); cerrarHoja(); return render();
    }
    case "elegirRutinaSocio": return hojaElegirRutinaSocio(id);
    case "asignarUna": { const s = socio(id); s.rutina = b.dataset.r ? {id:b.dataset.r, sig:0, por:"profe"} : null; guardar(); toast(b.dataset.r ? "✅ Rutina asignada" : "Rutina quitada"); return hojaSocio(id); }
    case "verRutina": return hojaRutina(id, "staff");
    case "asignar": return hojaAsignar(id);
    case "toggleAsig": asigSel.has(id) ? asigSel.delete(id) : asigSel.add(id); return pintarAsignar();
    case "confirmarAsig": {
      let n = 0; DB.socios.forEach(s => { const tiene = s.rutina && s.rutina.id === asigRutina;
        if (asigSel.has(s.id) && !tiene) { s.rutina = {id:asigRutina, sig:0, por:"profe"}; n++; } else if (!asigSel.has(s.id) && tiene) s.rutina = null; });
      guardar(); cerrarHoja(); toast(`✅ Rutina asignada${n ? ` a ${n} socio${n === 1 ? "" : "s"} más` : ""}`); return render();
    }
    case "duplicarRutina": { const t = JSON.parse(JSON.stringify(rutinaDe(id))); t.id = uid("r"); t.n = t.n + " (copia)"; t.base = 0; DB.rutinas.unshift(t); guardar(); cerrarHoja(); toast("📄 Copia creada: ya la podés editar"); return render(); }
    case "borrarRutina": {
      if (DB.rutinas.length <= 1) return toast("Tiene que quedar al menos una rutina");
      const usan = DB.socios.filter(s => s.rutina && s.rutina.id === id);
      if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = usan.length ? `⚠️ La usan ${usan.length}: tocá de nuevo` : "⚠️ Tocá de nuevo para borrar"; return; }
      usan.forEach(s => s.rutina = null); DB.rutinas = DB.rutinas.filter(t => t.id !== id); guardar(); cerrarHoja(); toast("Rutina borrada"); return render();
    }
    case "nuevaRutina": return abrirEditor(null);
    case "editarRutina": cerrarHoja(); return abrirEditor(id);
    case "edCancelar": borr = null; return cerrarCapa();
    case "edGuardar": return guardarEditor();
    case "edAgregarDia": leerEditor(); borr.dias.push({n:"Día " + (borr.dias.length + 1), ej:[]}); return pintarEditor();
    case "edBorrarDia": leerEditor(); if (borr.dias.length <= 1) return toast("La rutina necesita al menos un día"); borr.dias.splice(+b.dataset.i, 1); return pintarEditor();
    case "edSeries": { leerEditor(); const x = borr.dias[+b.dataset.i].ej[+b.dataset.k]; x[1] = Math.max(1, Math.min(10, x[1] + +b.dataset.d)); return pintarEditor(); }
    case "edMover": { leerEditor(); const L = borr.dias[+b.dataset.i].ej, k = +b.dataset.k; if (k > 0) [L[k - 1], L[k]] = [L[k], L[k - 1]]; return pintarEditor(); }
    case "edQuitar": leerEditor(); borr.dias[+b.dataset.i].ej.splice(+b.dataset.k, 1); return pintarEditor();
    case "edAgregarEj": leerEditor(); selDia = +b.dataset.i; return hojaSelector();
    case "edGrupo": selGrupo = b.dataset.g; if ($("#buscaEj")) $("#buscaEj").value = ""; return pintarSelector();
    case "edElegirEj": { const e = CATALOGO[id], def = e.tipo === "min" ? [id, 1, "10", 0] : e.tipo === "seg" ? [id, 3, "30", 45] : e.tipo === "pc" ? [id, 3, "12", 60] : [id, 3, "10–12", 90];
      borr.dias[selDia].ej.push(def); toast(`＋ ${e.n}`); pintarEditor(); return; }
    case "verClase": return hojaClase(id);
    case "editarClase": return hojaFormClase(id || null);
    case "cIco": leerClase(); borrClase.ico = b.dataset.i; return pintarFormClase();
    case "cDia": { leerClase(); const d = +b.dataset.d, L = borrClase.dias; L.includes(d) ? L.splice(L.indexOf(d), 1) : L.push(d); return pintarFormClase(); }
    case "guardarClase": {
      leerClase(); const c = borrClase;
      if (c.n.length < 2) return toast("Poné el nombre de la clase"); if (!c.dias.length) return toast("Elegí al menos un día"); if (!c.h) return toast("Elegí la hora");
      if (c.id) { const i = DB.clases.findIndex(x => x.id === c.id); DB.clases[i] = c; } else { c.id = uid("c"); DB.clases.push(c); }
      guardar(); cerrarHoja(); toast("✅ Clase guardada"); return render();
    }
    case "borrarClase":
      if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "⚠️ Tocá de nuevo para borrar"; return; }
      DB.clases = DB.clases.filter(x => x.id !== borrClase.id); guardar(); cerrarHoja(); toast("Clase borrada"); return render();
    case "publicarAviso": { const t = $("#aviso").value.trim(); if (t.length < 3) return toast("Escribí el aviso"); DB.avisos.unshift({id:uid("a"), f:hoyStr(), txt:t}); guardar(); toast("📣 Aviso publicado"); return render(); }
    case "borrarAviso": DB.avisos = DB.avisos.filter(x => x.id !== id); guardar(); return render();
    case "guardarDesafio": DB.desafio = {meta:Math.max(1, +$("#dMeta").value || 12), premio:$("#dPremio").value.trim() || "Premio sorpresa"}; guardar(); return toast("✅ Desafío guardado");
    case "color": DB.gym.color = b.dataset.c; guardar(); aplicarMarca(); $$(".sw").forEach(x => x.classList.toggle("on", x === b)); return;
    case "quitarLogo": DB.gym.logo = null; guardar(); return render();
    case "guardarMarca": {
      const g = DB.gym, n = $("#gNombre").value.trim(); if (n.length < 2) return toast("Poné el nombre del gimnasio");
      const hor = {}; for (const d of [0,1,2,3,4,5,6]) { const a1 = +$("#hA" + d).value, c1 = +$("#hC" + d).value; if (a1 < 0) { hor[d] = null; continue; } if (c1 <= a1) return toast(`Revisá el horario del ${DIA[d].toLowerCase()}`); hor[d] = [a1, c1]; }
      Object.assign(g, {nombre:n, direccion:$("#gDir").value.trim(), whatsapp:$("#gWa").value.trim(), alias:$("#gAlias").value.trim(), capacidad:Math.max(1, +$("#gCap").value || 35), horario:hor});
      guardar(); toast("✅ Datos del gimnasio guardados"); return render();
    }
    case "agregarPlan": leerPlanes(); DB.planes.push({id:uid("p"), n:"Plan nuevo", precio:30000}); guardar(); return render();
    case "guardarPlanes": leerPlanes(); guardar(); return toast("✅ Precios guardados");
    case "cambiarPin": { const p = $("#nuevoPin").value.replace(/\D/g, ""); if (p.length < 4 || p.length > 6) return toast("El PIN tiene que tener de 4 a 6 números"); DB.pin = p; guardar(); $("#nuevoPin").value = ""; return toast("🔐 PIN cambiado"); }
    case "reiniciar":
      if (!confirmarReinicio) { confirmarReinicio = true; return render(); }
      confirmarReinicio = false; DB = semilla(); guardar(); simular(); toast("Datos de ejemplo restaurados"); return render();
  }
}
function leerPlanes(){ DB.planes.forEach((p, i) => { const n = $("#plN" + i), v = $("#plP" + i); if (n) p.n = n.value.trim() || p.n; if (v) p.precio = +v.value || p.precio; }); }

/* ================= ARRANQUE ================= */
render();
(() => { const i = $("#intro"); if (!i) return; let ido = false;
  const irse = () => { if (ido) return; ido = true; i.classList.add("fuera"); setTimeout(() => i.remove(), 550); };
  i.onclick = irse; setTimeout(irse, 1600); })();
if (YO && YO.rol === "socio" && socioYo()) { const ss = entrenoDe(YO.id).sesion; if (ss && ss.f === hoyStr() && ss.descansoHasta) abrirGuia(); }
// En la demo, cada minuto entran socios nuevos (ocupación en vivo) y se refresca la pantalla si no estás escribiendo
setInterval(() => {
  if (!DB.demo) return; simular();
  const escribiendo = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!escribiendo && !$("#capa").innerHTML && !$("#hoja").innerHTML && YO && YO.rol !== "kiosco") render();
}, 60000);
</script>
<script>
const VERSION_APP = "20260930112427";
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
  document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
}).catch(() => {}));
async function buscarVersionNueva(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    const v = (await r.json()).v;
    if (v && v !== VERSION_APP) avisarVersionNueva();
  } catch {}
}
function avisarVersionNueva(){
  if (document.getElementById("versionNueva") || document.getElementById("capa").innerHTML) return;
  const d = document.createElement("div"); d.id = "versionNueva";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;" +
    "background:#E4E7EC;color:#0B0C0E;padding:12px 14px;border-radius:16px;font:800 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4)";
  d.innerHTML = '<span style="flex:1">✨ Hay una versión nueva de GymBlack</span>';
  const b = document.createElement("button"); b.textContent = "Actualizar";
  b.style.cssText = "border:0;border-radius:12px;padding:9px 14px;font:800 15px system-ui,sans-serif;background:#0B0C0E;color:#E4E7EC";
  b.onclick = () => location.reload();
  d.append(b); document.body.append(d);
}
setTimeout(buscarVersionNueva, 4000);
setInterval(buscarVersionNueva, 20 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) buscarVersionNueva(); });
</script>
